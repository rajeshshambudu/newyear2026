
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #ffffff; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-gradient { background: linear-gradient(135deg, #60a5fa, #2563eb); }
        .text-glow { text-shadow: 0 0 20px rgba(96, 165, 250, 0.4); }
        /* Custom scrollbar for resolutions list */
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <canvas id="fireworks" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <main class="z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section class="glass p-10 rounded-3xl text-center border-t border-white/10">
            <h2 id="greeting" class="text-xs tracking-[0.4em] uppercase opacity-40 mb-4">Initialising 2026</h2>
            <h1 class="text-8xl font-black mb-8 text-glow">2026</h1>
            
            <div class="grid grid-cols-4 gap-4 mb-10">
                <div class="flex flex-col"><span id="days" class="text-3xl font-bold">00</span><span class="text-[10px] opacity-30 uppercase tracking-widest">Days</span></div>
                <div class="flex flex-col"><span id="hours" class="text-3xl font-bold">00</span><span class="text-[10px] opacity-30 uppercase tracking-widest">Hrs</span></div>
                <div class="flex flex-col"><span id="mins" class="text-3xl font-bold">00</span><span class="text-[10px] opacity-30 uppercase tracking-widest">Min</span></div>
                <div class="flex flex-col"><span id="secs" class="text-3xl font-bold text-blue-400">00</span><span class="text-[10px] opacity-30 uppercase tracking-widest">Sec</span></div>
            </div>

            <div class="text-left">
                <div class="flex justify-between text-[10px] uppercase tracking-[0.2em] mb-3 opacity-40 font-mono">
                    <span>Year Progress</span>
                    <span id="progPercent">0.0000%</span>
                </div>
                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden shadow-inner">
                    <div id="progBar" class="accent-gradient h-full transition-all duration-1000 shadow-[0_0_10px_rgba(96,165,250,0.5)]" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <section class="glass p-10 rounded-3xl flex flex-col h-[500px]">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold tracking-tight">2026 Resolutions</h3>
                <span id="goalCount" class="text-[10px] bg-white/5 border border-white/10 px-3 py-1 rounded-full opacity-60">0 Saved</span>
            </div>

            <div class="flex gap-3 mb-8">
                <input type="text" id="goalInput" placeholder="New resolution..." 
                    class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-sm focus:outline-none focus:border-blue-500/50 transition-all placeholder:opacity-20">
                <button onclick="addGoal()" class="accent-gradient px-6 py-3 rounded-2xl font-bold hover:scale-105 active:scale-95 transition-all text-lg leading-none">+</button>
            </div>

            <div id="goalList" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scroll">
                </div>
        </section>

    </main>

    <script>
        // --- SECURE LOCAL STORAGE LOGIC ---
        let goals = JSON.parse(localStorage.getItem('user_goals_2026')) || [];

        function renderGoals() {
            const list = document.getElementById('goalList');
            list.innerHTML = '';
            goals.forEach((goal, i) => {
                const item = document.createElement('div');
                item.className = "glass p-4 rounded-2xl flex justify-between items-center text-sm border-l-4 border-blue-500/30";
                item.innerHTML = `<span class="opacity-80">${goal}</span>
                                 <button onclick="removeGoal(${i})" class="text-red-400/50 hover:text-red-400 text-xl font-light">&times;</button>`;
                list.appendChild(item);
            });
            document.getElementById('goalCount').innerText = `${goals.length} Saved`;
            localStorage.setItem('user_goals_2026', JSON.stringify(goals));
        }

        function addGoal() {
            const input = document.getElementById('goalInput');
            if(input.value.trim()) {
                goals.push(input.value.trim());
                input.value = '';
                renderGoals();
                spawnBurst(window.innerWidth * 0.75, window.innerHeight / 2);
            }
        }

        function removeGoal(i) { goals.splice(i, 1); renderGoals(); }

        // --- COUNTDOWN & PROGRESS ---
        function updateAll() {
            const now = new Date();
            const end = new Date('January 1, 2027 00:00:00').getTime();
            const start = new Date('January 1, 2026 00:00:00').getTime();
            const gap = end - now.getTime();

            // Progress Logic
            const progress = ((now - start) / (end - start)) * 100;
            document.getElementById('progBar').style.width = progress + '%';
            document.getElementById('progPercent').innerText = progress.toFixed(5) + '%';

            // Timer Logic
            document.getElementById('days').innerText = Math.max(0, Math.floor(gap / (1000*60*60*24))).toString().padStart(2,'0');
            document.getElementById('hours').innerText = Math.max(0, Math.floor((gap % (1000*60*60*24)) / (1000*60*60))).toString().padStart(2,'0');
            document.getElementById('mins').innerText = Math.max(0, Math.floor((gap % (1000*60*60)) / (1000*60))).toString().padStart(2,'0');
            document.getElementById('secs').innerText = Math.max(0, Math.floor((gap % (1000*60)) / 1000)).toString().padStart(2,'0');
        }

        // --- FIREWORKS SYSTEM ---
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor(x,y,c) {
                this.x = x; this.y = y; this.c = c;
                this.v = {x:(Math.random()-0.5)*10, y:(Math.random()-0.5)*10};
                this.a = 1; this.f = 0.96;
            }
            draw() {
                ctx.globalAlpha = this.a; ctx.fillStyle = this.c;
                ctx.beginPath(); ctx.arc(this.x, this.y, 1.2, 0, 7); ctx.fill();
            }
            update() { this.v.x *= this.f; this.v.y *= this.f; this.x += this.v.x; this.y += this.v.y; this.a -= 0.015; }
        }

        function spawnBurst(x,y) {
            const color = `hsl(${Math.random()*360}, 70%, 60%)`;
            for(let i=0; i<40; i++) particles.push(new Particle(x,y,color));
        }

        function loop() {
            ctx.fillStyle = 'rgba(5,5,5,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            particles.forEach((p,i) => { if(p.a>0){p.update(); p.draw();} else particles.splice(i,1); });
            if(Math.random()<0.03) spawnBurst(Math.random()*canvas.width, Math.random()*canvas.height);
            requestAnimationFrame(loop);
        }

        // --- BOOTSTRAP ---
        setInterval(updateAll, 1000);
        renderGoals();
        loop();
        document.getElementById('goalInput').addEventListener('keypress', (e) => { if(e.key==='Enter') addGoal(); });
    </script>
</body>
</html>
