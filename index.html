<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Dashboard | Happy New Year</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #050505; overflow: hidden; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .gradient-text { background: linear-gradient(to bottom right, #ffffff, #60a5fa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .celebration-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(20px); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen">

    <canvas id="fireworks" class="absolute inset-0 z-0"></canvas>

    <div id="celebration" class="celebration-overlay">
        <div class="text-center">
            <h1 class="text-6xl md:text-9xl font-black gradient-text mb-4">HAPPY 2027!</h1>
            <p class="text-xl opacity-80 tracking-widest uppercase">The future is here.</p>
            <button onclick="closeCelebration()" class="mt-12 glass px-10 py-4 rounded-full text-sm font-bold hover:bg-white/10">Close</button>
        </div>
    </div>

    <main id="mainContent" class="z-10 text-center px-4 w-full max-w-2xl transition-all duration-1000">
        <div class="glass p-8 md:p-12 rounded-[2.5rem] shadow-2xl relative overflow-hidden">
            
            <h2 id="greeting" class="text-lg md:text-xl font-medium tracking-widest uppercase mb-4 opacity-70">Hello 2026</h2>
            
            <h1 id="yearDisplay" class="text-7xl md:text-9xl font-extrabold mb-8 gradient-text tracking-tighter">2026</h1>
            
            <div class="grid grid-cols-4 gap-4 md:gap-8 mb-10">
                <div class="flex flex-col"><span id="days" class="text-3xl md:text-5xl font-bold">00</span><span class="text-[10px] uppercase tracking-widest mt-2 opacity-40">Days</span></div>
                <div class="flex flex-col"><span id="hours" class="text-3xl md:text-5xl font-bold">00</span><span class="text-[10px] uppercase tracking-widest mt-2 opacity-40">Hours</span></div>
                <div class="flex flex-col"><span id="minutes" class="text-3xl md:text-5xl font-bold">00</span><span class="text-[10px] uppercase tracking-widest mt-2 opacity-40">Mins</span></div>
                <div class="flex flex-col"><span id="seconds" class="text-3xl md:text-5xl font-bold text-blue-500">00</span><span class="text-[10px] uppercase tracking-widest mt-2 opacity-40">Secs</span></div>
            </div>

            <div class="mb-10 px-4">
                <div class="flex justify-between text-[10px] uppercase tracking-widest mb-2 opacity-50">
                    <span>Year Progress</span>
                    <span id="progressPercent">0%</span>
                </div>
                <div class="w-full bg-white/10 rounded-full h-1.5 overflow-hidden">
                    <div id="progressBar" class="bg-blue-500 h-full transition-all duration-1000" style="width: 0%"></div>
                </div>
            </div>

            <button onclick="changeMessage()" class="glass px-8 py-3 rounded-full text-xs font-bold tracking-widest uppercase hover:bg-white/10 transition-all border border-white/10">
                Get a Wish ✨
            </button>
        </div>
    </main>

    <script>
        let isCelebrated = false;

        function updateAll() {
            const now = new Date();
            const targetDate = new Date('January 1, 2027 00:00:00').getTime();
            const gap = targetDate - now.getTime();

            // Trigger Midnight Celebration
            if (gap <= 0 && !isCelebrated) {
                triggerCelebration();
            }

            // Progress Logic
            const start = new Date(now.getFullYear(), 0, 1);
            const end = new Date(now.getFullYear() + 1, 0, 1);
            const progress = (now - start) / (end - start) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressPercent').innerText = progress.toFixed(5) + '%';

            // Countdown Logic
            const d = Math.max(0, Math.floor(gap / (1000 * 60 * 60 * 24)));
            const h = Math.max(0, Math.floor((gap % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            const m = Math.max(0, Math.floor((gap % (1000 * 60 * 60)) / (1000 * 60)));
            const s = Math.max(0, Math.floor((gap % (1000 * 60)) / 1000));

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');
        }

        function triggerCelebration() {
            isCelebrated = true;
            document.getElementById('celebration').style.display = 'flex';
            document.getElementById('mainContent').style.filter = 'blur(20px)';
            // Intense fireworks
            setInterval(() => createFirework(Math.random()*window.innerWidth, Math.random()*window.innerHeight), 200);
        }

        function closeCelebration() {
            document.getElementById('celebration').style.display = 'none';
            document.getElementById('mainContent').style.filter = 'none';
            document.getElementById('yearDisplay').innerText = '2027';
        }

        function changeMessage() {
            const wishes = ["Big dreams. Big moves. 🥂", "Code more, stress less. 💻", "2026 is yours! ✨"];
            document.getElementById('greeting').innerText = wishes[Math.floor(Math.random() * wishes.length)];
            createFirework(window.innerWidth / 2, window.innerHeight / 2);
        }

        // --- FIREWORKS ENGINE ---
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 12, y: (Math.random() - 0.5) * 12 };
                this.alpha = 1; this.friction = 0.95;
            }
            update() {
                this.velocity.x *= this.friction; this.velocity.y *= this.friction;
                this.x += this.velocity.x; this.y += this.velocity.y;
                this.alpha -= 0.015;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.beginPath(); ctx.arc(this.x, this.y, 1.2, 0, Math.PI * 2);
                ctx.fillStyle = this.color; ctx.fill();
            }
        }

        function createFirework(x, y) {
            const color = `hsl(${Math.random() * 360}, 80%, 60%)`;
            for (let i = 0; i < 50; i++) particles.push(new Particle(x, y, color));
        }

        function animate() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                if (p.alpha > 0) { p.update(); p.draw(); }
                else { particles.splice(i, 1); }
            });
            if (Math.random() < 0.04) createFirework(Math.random() * canvas.width, Math.random() * canvas.height);
            requestAnimationFrame(animate);
        }
        
        setInterval(updateAll, 1000);
        animate();
    </script>
</body>
</html>
