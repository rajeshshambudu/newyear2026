
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Dashboard | Custom Themes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --accent: #3b82f6; --accent-glow: rgba(59, 130, 246, 0.5); }
        body { background-color: #050505; color: #ffffff; overflow-x: hidden; font-family: ui-sans-serif, system-ui, sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-bg { background-color: var(--accent); }
        .accent-text { color: var(--accent); }
        .accent-border { border-color: var(--accent); }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8">

    <canvas id="fireworks" class="fixed inset-0 z-0 pointer-events-none"></canvas>

    <div class="fixed top-6 left-6 z-50 flex gap-2">
        <button onclick="setTheme('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border border-white/20"></button>
        <button onclick="setTheme('#ef4444')" class="w-6 h-6 rounded-full bg-red-500 border border-white/20"></button>
        <button onclick="setTheme('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border border-white/20"></button>
        <button onclick="setTheme('#a855f7')" class="w-6 h-6 rounded-full bg-purple-500 border border-white/20"></button>
        <button onclick="setTheme('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border border-white/20"></button>
    </div>

    <main class="z-10 w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <section class="glass p-10 rounded-3xl text-center flex flex-col justify-center relative overflow-hidden">
            <h1 class="text-7xl md:text-9xl font-black mb-6 tracking-tighter">2026</h1>
            <div class="grid grid-cols-4 gap-4 mb-10">
                <div class="flex flex-col"><span id="days" class="text-3xl font-bold">00</span><span class="text-[10px] opacity-30 uppercase">Days</span></div>
                <div class="flex flex-col"><span id="hours" class="text-3xl font-bold">00</span><span class="text-[10px] opacity-30 uppercase">Hrs</span></div>
                <div class="flex flex-col"><span id="mins" class="text-3xl font-bold">00</span><span class="text-[10px] opacity-30 uppercase">Min</span></div>
                <div class="flex flex-col"><span id="secs" class="text-3xl font-bold accent-text transition-colors duration-500">00</span><span class="text-[10px] opacity-30 uppercase">Sec</span></div>
            </div>
            <div class="text-left">
                <div class="flex justify-between text-[10px] uppercase tracking-widest mb-3 opacity-40">
                    <span>Year Progress</span>
                    <span id="progPercent">0%</span>
                </div>
                <div class="w-full bg-white/5 h-1.5 rounded-full overflow-hidden">
                    <div id="progBar" class="accent-bg h-full transition-all duration-1000 shadow-lg" style="width: 0%"></div>
                </div>
            </div>
        </section>

        <section class="glass p-10 rounded-3xl flex flex-col h-[520px]">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold">Resolutions</h3>
                <button onclick="exportGoals()" class="text-[10px] border border-white/10 px-3 py-1 rounded-full hover:bg-white/10 transition-all uppercase">Export 💾</button>
            </div>
            <div class="flex gap-3 mb-8">
                <input type="text" id="goalInput" placeholder="Add a goal..." class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-3 text-sm focus:outline-none focus:border-white/30 transition-all">
                <button onclick="addGoal()" class="accent-bg px-6 py-3 rounded-2xl font-bold hover:opacity-90 transition-all text-xl">+</button>
            </div>
            <div id="goalList" class="flex-1 overflow-y-auto space-y-4 pr-2 custom-scroll"></div>
        </section>
    </main>

    <script>
        let goals = JSON.parse(localStorage.getItem('user_goals_2026')) || [];
        let currentTheme = localStorage.getItem('theme_2026') || '#3b82f6';

        function setTheme(color) {
            currentTheme = color;
            document.documentElement.style.setProperty('--accent', color);
            localStorage.setItem('theme_2026', color);
        }

        function renderGoals() {
            const list = document.getElementById('goalList');
            list.innerHTML = '';
            goals.forEach((goal, i) => {
                const item = document.createElement('div');
                item.className = "glass p-4 rounded-2xl flex justify-between items-center text-sm border-l-2 accent-border";
                item.innerHTML = `<span>${goal}</span><button onclick="removeGoal(${i})" class="text-red-500/50 hover:text-red-500">&times;</button>`;
                list.appendChild(item);
            });
            localStorage.setItem('user_goals_2026', JSON.stringify(goals));
        }

        function addGoal() {
            const input = document.getElementById('goalInput');
            if(input.value.trim()) {
                goals.push(input.value.trim());
                input.value = '';
                renderGoals();
                burst(window.innerWidth * 0.75, window.innerHeight / 2);
            }
        }

        function removeGoal(i) { goals.splice(i, 1); renderGoals(); }

        function exportGoals() {
            if(!goals.length) return;
            const content = "2026 RESOLUTIONS\n\n" + goals.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = '2026_goals.txt'; a.click();
        }

        function update() {
            const now = new Date();
            const start = new Date('2026-01-01');
            const end = new Date('2027-01-01');
            const gap = end - now;
            const progress = ((now - start) / (end - start)) * 100;
            document.getElementById('progBar').style.width = progress + '%';
            document.getElementById('progPercent').innerText = progress.toFixed(4) + '%';
            document.getElementById('days').innerText = Math.max(0, Math.floor(gap / 864e5)).toString().padStart(2,'0');
            document.getElementById('hours').innerText = Math.max(0, Math.floor((gap % 864e5) / 36e5)).toString().padStart(2,'0');
            document.getElementById('mins').innerText = Math.max(0, Math.floor((gap % 36e5) / 6e4)).toString().padStart(2,'0');
            document.getElementById('secs').innerText = Math.max(0, Math.floor((gap % 6e4) / 1e3)).toString().padStart(2,'0');
        }

        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let parts = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();

        class Particle {
            constructor(x,y,c) {
                this.x = x; this.y = y; this.c = c;
                this.v = {x:(Math.random()-0.5)*8, y:(Math.random()-0.5)*8};
                this.a = 1;
            }
            update() { this.x+=this.v.x; this.y+=this.v.y; this.a-=0.015; }
            draw() { ctx.globalAlpha = this.a; ctx.fillStyle = this.c; ctx.beginPath(); ctx.arc(this.x, this.y, 1.2, 0, 7); ctx.fill(); }
        }

        function burst(x,y) {
            for(let i=0; i<40; i++) parts.push(new Particle(x,y,currentTheme));
        }

        function loop() {
            ctx.fillStyle = 'rgba(5,5,5,0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            parts.forEach((p,i) => { if(p.a>0){p.update(); p.draw();} else parts.splice(i,1); });
            if(Math.random()<0.02) burst(Math.random()*canvas.width, Math.random()*canvas.height);
            requestAnimationFrame(loop);
        }

        setTheme(currentTheme);
        setInterval(update, 1000);
        renderGoals();
        loop();
        document.getElementById('goalInput').onkeypress = (e) => { if(e.key==='Enter') addGoal(); };
    </script>
</body>
</html>
