
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Dashboard</title>

<style>
:root {
  --accent: #3b82f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: #050505;
  color: #fff;
  font-family: system-ui, sans-serif;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  max-width: 1000px;
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 24px;
}

h1 {
  font-size: 80px;
  margin: 0 0 20px;
  text-align: center;
}

.timer {
  display: grid;
  grid-template-columns: repeat(4,1fr);
  text-align: center;
  gap: 10px;
}

.timer span {
  font-size: 28px;
  font-weight: bold;
}

.progress {
  margin-top: 20px;
}

.progress-bar {
  height: 6px;
  background: rgba(255,255,255,0.1);
  border-radius: 6px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: width 0.5s;
}

.theme-buttons button {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
}

.goals input {
  width: 100%;
  padding: 10px;
  border-radius: 12px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.08);
  color: white;
}

.goals button {
  margin-top: 10px;
  width: 100%;
  padding: 10px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

.goal {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border-left: 3px solid var(--accent);
  border-radius: 12px;
  margin-top: 10px;
}

.goal button {
  background: none;
  border: none;
  color: #ff5555;
  cursor: pointer;
}

@media (max-width: 800px) {
  .container { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<div class="container">

  <!-- LEFT -->
  <div class="card">
    <div class="theme-buttons">
      <button style="background:#3b82f6" onclick="setTheme('#3b82f6')"></button>
      <button style="background:#ef4444" onclick="setTheme('#ef4444')"></button>
      <button style="background:#10b981" onclick="setTheme('#10b981')"></button>
      <button style="background:#a855f7" onclick="setTheme('#a855f7')"></button>
      <button style="background:#f59e0b" onclick="setTheme('#f59e0b')"></button>
    </div>

    <h1>2026</h1>

    <div class="timer">
      <div><span id="d">00</span><br>Days</div>
      <div><span id="h">00</span><br>Hrs</div>
      <div><span id="m">00</span><br>Min</div>
      <div><span id="s">00</span><br>Sec</div>
    </div>

    <div class="progress">
      <small>Year Progress: <span id="percent">0%</span></small>
      <div class="progress-bar">
        <div id="bar" class="progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="card goals">
    <h2>Resolutions</h2>
    <input id="goalInput" placeholder="Add a goal">
    <button onclick="addGoal()">Add Goal</button>
    <div id="goalList"></div>
  </div>

</div>

<script>
let goals = JSON.parse(localStorage.getItem("goals2026")) || [];
let theme = localStorage.getItem("theme2026") || "#3b82f6";
setTheme(theme);

function setTheme(c) {
  document.documentElement.style.setProperty("--accent", c);
  localStorage.setItem("theme2026", c);
}

function renderGoals() {
  const list = document.getElementById("goalList");
  list.innerHTML = "";
  goals.forEach((g,i)=>{
    const div = document.createElement("div");
    div.className = "goal";
    div.innerHTML = `<span>${g}</span><button onclick="removeGoal(${i})">✕</button>`;
    list.appendChild(div);
  });
  localStorage.setItem("goals2026", JSON.stringify(goals));
}

function addGoal() {
  const input = document.getElementById("goalInput");
  if(input.value.trim()){
    goals.push(input.value.trim());
    input.value="";
    renderGoals();
  }
}

function removeGoal(i){
  goals.splice(i,1);
  renderGoals();
}

function updateTime() {
  const now = new Date();
  const start = new Date("2026-01-01");
  const end = new Date("2027-01-01");
  const gap = end - now;

  document.getElementById("d").textContent = Math.max(0, Math.floor(gap/86400000));
  document.getElementById("h").textContent = Math.max(0, Math.floor(gap/3600000)%24);
  document.getElementById("m").textContent = Math.max(0, Math.floor(gap/60000)%60);
  document.getElementById("s").textContent = Math.max(0, Math.floor(gap/1000)%60);

  const p = Math.min(100, ((now-start)/(end-start))*100);
  document.getElementById("percent").textContent = p.toFixed(2)+"%";
  document.getElementById("bar").style.width = p+"%";
}

renderGoals();
updateTime();
setInterval(updateTime,1000);
</script>

</body>
</html>
